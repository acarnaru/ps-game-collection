      </div>

          <div class="chips" id="elementChips"></div>
        </div>

        </div>

        <div class="filtergroup" id="battleGroup" style="display:none;">

          <div class="chips" id="battleChips"></div>
        </div>

        <div class="filtermeta" id="filterMeta">
          <span id="stats"></span>
        </div>
      </div>
    </div>

      (function syncHeaderHeight(){
        const header = document.querySelector(".sticky-header");
        if (!header) return;

        function setH(){
          const h = header.getBoundingClientRect().height;
          document.documentElement.style.setProperty("--appHeaderH", Math.ceil(h) + "px");
        }

        window.addEventListener("resize", setH);
        window.addEventListener("load", setH);
        window.addEventListener("orientationchange", setH);
        setH();

        if ("ResizeObserver" in window) {
          const ro = new ResizeObserver(() => setH());
          ro.observe(header);
        }
      })();

      (function () {

          const box = wrap ? wrap.scrollTop : 0;
          return Math.max(win, box);
        }

          btn.classList.toggle("show", scrollPos() > 300);
        }

        showOrHide();
        btn.addEventListener("click", function () {
          window.scrollTo({ top: 0, behavior: "smooth" });

                                   {"name": "Splatter Splasher", "element": "Magic", "terrain": "Sea", "driver": ["Splat", "Power Blue Splat"], "variant": "Power Blue", "build": null}, 
                                   {"name": "Stealth Stinger", "element": "Life", "terrain": "Sky", "driver": ["Super Shot Stealth Elf", "Dark Stealth Elf"], "variant": "Core", "build": null}, 
                                   {"name": "Stealth Stinger", "element": "Life", "terrain": "Sky", "driver": ["Super Shot Stealth Elf", "Dark Stealth Elf"], "variant": "Nitro", "build": null}, 
                                   {"name": "Sunrunner", "element": "Light", "terrain": "Sky", "driver": ["Astroblast", "Legendary Astroblast"], "variant": "Core", "build": null}, 
                                   {"name": "Sunrunner", "element": "Light", "terrain": "Sky", "driver": ["Astroblast", "Legendary Astroblast"], "variant": "Legendary", "build": null}, 
                                   {"name": "Thump Truck", "element": "Earth", "terrain": "Land", "driver": ["Smash Hit", "Steel Plated Smash Hit"], "variant": "Core", "build": null}, 
                                   {"name": "Tomb Buggy", "element": "Undead", "terrain": "Land", "driver": ["Bone Bash Roller Brawl", "Legendary Roller Brawl"], "variant": "Core", "build": null}], 
                                   
                      "crystals": []};

        const REGULAR_TAGS = new Set(["Core", "Giant", "Mini", "Skylander Sensei", "Swapper", "Trap Master", "Villain Sensei"]);
              const TABS = [
                { id:"skylanders", label:"Skylanders", subtitle:"Skylanders Catalogue", showVariant:true, chipGroups:["game","element"], extraGroups:[] },
                { id:"magic", label:"Magic Items", subtitle:"Magic Catalogue", showVariant:true, chipGroups:["game"], extraGroups:[] },
                { id:"locations", label:"Locations", subtitle:"Locations Catalogue", showVariant:false, chipGroups:["game"], extraGroups:[] },
                { id:"traps", label:"Traps", subtitle:"Traps Catalogue", showVariant:true, chipGroups:["element"], extraGroups:[] },
                { id:"vehicles", label:"Vehicles", subtitle:"Vehicles Catalogue", showVariant:true, chipGroups:["element","terrain"], extraGroups:["terrain"] },
                { id:"crystals", label:"Creation Crystals", subtitle:"Crystals Catalogue", showVariant:true, chipGroups:["element","battleClass"], extraGroups:["battleClass"] },
              ];

        const COLS = {
          skylanders: [
            { key:"name", label:"Skylander" },
            { key:"element", label:"Element" },
            { key:"game", label:"Game" },
            { key:"variant", label:"Variant" },
            { key:"build", label:"Build" },
            { key:"hat", label:"Hat" },
          ],
          magic: [
            { key:"name", label:"Item" },
            { key:"variant", label:"Variant" },
            { key:"game", label:"Game" },
          ],
          locations: [
            { key:"name", label:"Location" },
            { key:"game", label:"Game" },
          ],
          traps: [
            { key:"name", label:"Trap" },
            { key:"element", label:"Element" },
            { key:"variant", label:"Variant" },
            { key:"villain", label:"Villain" },
          ],
          vehicles: [
            { key:"name", label:"Vehicle" },
            { key:"element", label:"Element" },
            { key:"terrain", label:"Terrain" },
            { key:"driver", label:"Driver" },
            { key:"variant", label:"Variant" },
            { key:"build", label:"Build" },
          ],
          crystals: [
            { key:"name", label:"Crystal" },
            { key:"element", label:"Element" },
            { key:"variant", label:"Variant" },
            { key:"battleClass", label:"Battle Class" },
            { key:"build", label:"Build" },
            { key:"hat", label:"Hat" },
          ],
        };

        const GAME_VALUES = ["Spyro's Adventure","Giants","Swap Force","Trap Team","SuperChargers","Imaginators"];
        const ELEMENT_VALUES_BASE = ["Air","Water","Fire","Earth","Life","Undead","Magic","Tech","Light","Dark"];
        const ELEMENT_VALUES_WITH_CHAOS = [...ELEMENT_VALUES_BASE, "Chaos"];
        const TERRAIN_VALUES = ["Sky","Sea","Land"];
        const BATTLE_VALUES = ["Brawler","Sorcerer","Smasher","Bowslinger","Knight","Quickshot","Sentinel","Ninja","Bazooker","Swashbuckler","Kaos"];

        let activeTab = "skylanders";
        let sortAsc = true;

        const els = {
          tabToggle: document.getElementById("tabToggle"),
          subTitle: document.getElementById("subTitle"),
          q: document.getElementById("q"),
          variantSel: document.getElementById("variantSel"),
          clear: document.getElementById("clear"),
          thead: document.getElementById("thead"),
          tbody: document.getElementById("tbody"),
          stats: document.getElementById("stats"),
          gameGroup: document.getElementById("gameGroup"),
          elementGroup: document.getElementById("elementGroup"),
          terrainGroup: document.getElementById("terrainGroup"),
          battleGroup: document.getElementById("battleGroup"),
          gameChips: document.getElementById("gameChips"),
          elementChips: document.getElementById("elementChips"),
          terrainChips: document.getElementById("terrainChips"),
          battleChips: document.getElementById("battleChips"),
        };

        const contentWrap = document.querySelector('.wrap');


        const state = {
          q: "",
          variant: "all",
          game: new Set(),
          element: new Set(),
          terrain: new Set(),
          battleClass: new Set(),
        };

      function fillSet(set, values) {
        set.clear();
        values.forEach(v => set.add(v));
      }

      function resetFiltersToDefault() {
        // Default behaviour (like ps_index): ALL chips are pressed.
        // If a user deselects every chip in a visible category, results must be 0.

        // Always reset variant to All (except tabs where it's hidden)
        state.variant = "all";
        els.variantSel.value = "all";

        // Clear all sets first
        state.game.clear();
        state.element.clear();
        state.terrain.clear();
        state.battleClass.clear();

        // Fill only the chip groups that exist for the active tab
        if (activeTab === "skylanders") {
          fillSet(state.game, GAME_VALUES);
          fillSet(state.element, ELEMENT_VALUES_WITH_CHAOS);
        } else if (activeTab === "magic" || activeTab === "locations") {
          fillSet(state.game, GAME_VALUES);
        } else if (activeTab === "traps") {
          fillSet(state.element, ELEMENT_VALUES_WITH_CHAOS);
        } else if (activeTab === "vehicles") {
          fillSet(state.element, ELEMENT_VALUES_BASE);
          fillSet(state.terrain, TERRAIN_VALUES);
        } else if (activeTab === "crystals") {
          fillSet(state.element, ELEMENT_VALUES_BASE);
          fillSet(state.battleClass, BATTLE_VALUES);
        }
      }

      function makeChip(label, groupKey) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip";
        btn.innerHTML = "<b>" + label + "</b>";
        btn.addEventListener("click", () => {
          const set = state[groupKey];
          if (set.has(label)) set.delete(label); else set.add(label);
          render();
        });
        return btn;
      }

      function buildTabs() {
        els.tabToggle.innerHTML = "";
        TABS.forEach(t => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "chip" + (t.id === activeTab ? " on" : "");
          btn.setAttribute("role","tab");
          btn.setAttribute("aria-selected", t.id === activeTab ? "true" : "false");
          btn.innerHTML = "<b>" + t.label + "</b>";
          btn.addEventListener("click", () => {
            activeTab = t.id;
            resetFiltersToDefault();
            sortAsc = true;
            render();
            buildTabs();
          });
          els.tabToggle.appendChild(btn);
        });
      }

      function buildChips() {
        // Games (not present in Traps tab)
        els.gameChips.innerHTML = "";
        GAME_VALUES.forEach(v => els.gameChips.appendChild(makeChip(v, "game")));

        // Elements (Chaos only in Skylanders + Traps)
        els.elementChips.innerHTML = "";
        const elementVals = (activeTab === "skylanders" || activeTab === "traps") ? ELEMENT_VALUES_WITH_CHAOS : ELEMENT_VALUES_BASE;
        elementVals.forEach(v => els.elementChips.appendChild(makeChip(v, "element")));

        // Terrain (Vehicles only)
        els.terrainChips.innerHTML = "";
        TERRAIN_VALUES.forEach(v => els.terrainChips.appendChild(makeChip(v, "terrain")));

        // Battle class (Crystals only)
        els.battleChips.innerHTML = "";
        BATTLE_VALUES.forEach(v => els.battleChips.appendChild(makeChip(v, "battleClass")));
      }

      function chipOnOff() {
        // show/hide chip groups per tab spec
        const tab = TABS.find(t => t.id === activeTab);
        const showGame = tab.chipGroups.includes("game");
        const showElement = tab.chipGroups.includes("element");
        const showTerrain = tab.chipGroups.includes("terrain");
        const showBattle = tab.chipGroups.includes("battleClass");

        els.gameGroup.style.display = showGame ? "" : "none";
        els.elementGroup.style.display = showElement ? "" : "none";
        els.terrainGroup.style.display = showTerrain ? "" : "none";
        els.battleGroup.style.display = showBattle ? "" : "none";
      }

      function syncChipUI() {
        // set .on class based on state sets
        function sync(container, set) {
          [...container.querySelectorAll(".chip")].forEach(ch => {
            const label = ch.textContent.trim();
            ch.classList.toggle("on", set.has(label));
          });
        }
        sync(els.gameChips, state.game);
        sync(els.elementChips, state.element);
        sync(els.terrainChips, state.terrain);
        sync(els.battleChips, state.battleClass);
      }

      function buildHeader() {
        const cols = COLS[activeTab] || [];
        const first = cols[0];
        const arrow = sortAsc ? "▼" : "▲";
        let th = "<tr>";
        cols.forEach((c, idx) => {
          if (idx === 0) {
            th += `<th class="col-title col-${c.key}">${c.label} <button id="nameSort" class="sort-arrow" aria-label="Toggle alphabetical sort" type="button">${arrow}</button></th>`;
          } else {
            th += `<th class="col-${c.key}">${c.label}</th>`;
          }
        });
        th += "</tr>";
        els.thead.innerHTML = th;

        const btn = document.getElementById("nameSort");
        if (btn) {
          btn.addEventListener("click", () => {
            sortAsc = !sortAsc;
            render();
          });
        }
      }

      function matchText(item, q) {
        if (!q) return true;
        const hay = JSON.stringify(item).toLowerCase();
        return hay.includes(q.toLowerCase());
      }

      function matchVariant(item) {
        if (activeTab === "locations") return true;
        const v = (item.variant || "").toString();
        if (state.variant === "all") return true;
        const isRegular = REGULAR_TAGS.has(v);
        return state.variant === "regular" ? isRegular : !isRegular;
      }

      function matchSet(itemVal, set) {
        // If the user deselects every chip in a category, nothing should match.
        if (!set || set.size === 0) return false;
        return set.has((itemVal || "").toString());
      }

      function matchAnyInArray(arr, set) {
        // Keep behaviour consistent with matchSet: empty selection => 0 matches.
        if (!set || set.size === 0) return false;
        if (!Array.isArray(arr)) return false;
        return arr.some(v => set.has((v||"").toString()));
      }

      function getFiltered() {
        const src = DATA[activeTab] || [];
        const q = state.q.trim();
        return src.filter(it => {
          if (!matchText(it, q)) return false;
          if (!matchVariant(it)) return false;

          // per-group filters
          if (activeTab === "skylanders") {
            if (!matchSet(it.game, state.game)) return false;
            if (!matchSet(it.element, state.element)) return false;
          } else if (activeTab === "magic" || activeTab === "locations") {
            if (!matchSet(it.game, state.game)) return false;
          } else if (activeTab === "traps") {
            if (!matchSet(it.element, state.element)) return false;
          } else if (activeTab === "vehicles") {
            if (!matchSet(it.element, state.element)) return false;
            if (!matchSet(it.terrain, state.terrain)) return false;
          } else if (activeTab === "crystals") {
            if (!matchSet(it.element, state.element)) return false;
            if (!matchSet(it.battleClass, state.battleClass)) return false;
          }
          return true;
        });
      }

      function renderRows(items) {
        const cols = COLS[activeTab] || [];
        items = [...items].sort((a,b) => {
          const av = (a.name || "").toString().toLowerCase();
          const bv = (b.name || "").toString().toLowerCase();
          if (av < bv) return sortAsc ? -1 : 1;
          if (av > bv) return sortAsc ? 1 : -1;
          const av2 = (a.variant || "").toString().toLowerCase();
          const bv2 = (b.variant || "").toString().toLowerCase();
          if (av2 < bv2) return -1;
          if (av2 > bv2) return 1;
          return 0;
        });

        function esc(s){
          return String(s ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
        }

        const rowsHtml = items.map(it => {
          const tds = cols.map(c => {
            let v = it[c.key];
            if (Array.isArray(v)) {
              const lis = v.filter(Boolean).map(x => `<li>${esc(x)}</li>`).join("");
              return `<td class="col-${c.key}"><ul class="stack">${lis}</ul></td>`;
            }
            return `<td class="col-${c.key}">${esc(v)}</td>`;
          }).join("");
          return `<tr>${tds}</tr>`;
        }).join("");
        els.tbody.innerHTML = rowsHtml;
        const total = (DATA[activeTab] || []).length;
        els.stats.textContent = `${items.length} visible out of ${total} total`;
      }

      function render() {
        const tab = TABS.find(t => t.id === activeTab);
        if (contentWrap) contentWrap.id = activeTab + 'Content';
        els.subTitle.textContent = tab ? tab.subtitle : "";
        // show/hide Variant dropdown (no Locations)
        els.variantSel.style.display = (tab && tab.showVariant) ? "" : "none";

        chipOnOff();
        buildChips();
        syncChipUI();
        buildHeader();

        const items = getFiltered();
        renderRows(items);
        buildTabs();
      }

      // events
      els.q.addEventListener("input", (e) => {
        state.q = e.target.value || "";
        render();
      });
      els.variantSel.addEventListener("change", (e) => {
        state.variant = e.target.value || "all";
        render();
      });
      els.clear.addEventListener("click", () => {
        state.q = "";
        els.q.value = "";
        resetFiltersToDefault();
        sortAsc = true;
        render();
      });

      // initial
      state.q = "";
      resetFiltersToDefault();
      buildTabs();
      render();
    </script>
  </body>
</html>
